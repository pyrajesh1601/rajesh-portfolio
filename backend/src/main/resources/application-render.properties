# Render terminates HTTPS and forwards traffic to this container port.
server.address=0.0.0.0
server.port=${PORT:10000}

# Use Render's assigned public HTTPS origin without trusting visitor headers.
# Override ALLOWED_ORIGINS when adding a custom domain (comma-separated).
portfolio.allowed-origins=${ALLOWED_ORIGINS:${RENDER_EXTERNAL_URL:}}

# Bound HTTP thread usage on the small free instance.
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.shutdown=graceful
