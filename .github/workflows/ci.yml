name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - run: npm run test:legacy
      - run: npm run build
      - name: Verify deployable Docker image
        run: docker build --tag rajesh-portfolio:ci .
      - name: Start container without secrets
        run: docker run --detach --name portfolio-ci --publish 127.0.0.1:10000:10000 --env SPRING_PROFILES_ACTIVE=render --env PORT=10000 --env RENDER_EXTERNAL_URL=https://portfolio.example rajesh-portfolio:ci
      - name: Verify running container
        run: node scripts/smoke-container.mjs
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs portfolio-ci 2>/dev/null || true
          docker rm --force portfolio-ci 2>/dev/null || true
